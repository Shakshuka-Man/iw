[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iw"
version = "0.1.0"
description = "Build Infinite Worlds world JSON from Python, with a plot compiler on top."
readme = "README.md"
# StrEnum (3.11) and `X | Y` annotations at runtime.
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["iw"]
